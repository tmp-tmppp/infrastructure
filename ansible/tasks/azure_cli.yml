---
# The Azure CLI from Microsoft's apt repository (Debian family). The repository's public key is kept in
# files/microsoft.asc; its fingerprint is BC52 8686 B50D 79E3 39D3  721C EB3E 94AD BE12 29CF (the Microsoft release
# signing key, learn.microsoft.com/cli/azure/install-azure-cli-linux). On macOS Homebrew installs it and cannot pin a
# version, so the playbook leaves it to you.
- name: Say that the Azure CLI is installed by hand on this platform
  ansible.builtin.debug:
    msg: >-
      The Azure CLI is not installed by the playbook on {{ ansible_facts['system'] }}. macOS: brew install azure-cli
      (Homebrew has no version pin; the Debian and Ubuntu install is pinned to {{ azure_cli_version }}).
  when: ansible_facts['system'] != 'Linux'

- name: Install the Azure CLI from Microsoft's apt repository
  when: ansible_facts['system'] == 'Linux'
  block:
    - name: Create the folder of the apt keys
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        mode: "0755"
      become: true

    - name: Put Microsoft's repository key in place
      ansible.builtin.copy:
        src: microsoft.asc
        dest: /etc/apt/keyrings/microsoft.asc
        owner: root
        mode: "0644"
      become: true

    - name: Add Microsoft's apt repository for the Azure CLI
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/azure-cli.sources
        owner: root
        mode: "0644"
        content: |
          Types: deb
          URIs: https://packages.microsoft.com/repos/azure-cli/
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: main
          Architectures: {{ tool_arch }}
          Signed-By: /etc/apt/keyrings/microsoft.asc
      become: true
      register: azure_cli_repository

    - name: Update the package lists after a new repository
      ansible.builtin.apt:
        update_cache: true
      become: true
      when: azure_cli_repository is changed and not ansible_check_mode

    - name: Look for the repository file
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/azure-cli.sources
      register: azure_cli_repository_file

    - name: Install the Azure CLI
      ansible.builtin.apt:
        name: "azure-cli={{ azure_cli_version }}"
        state: present
      become: true
      when: azure_cli_repository_file.stat.exists

    - name: Say that the package waits for the repository
      ansible.builtin.debug:
        msg: "A real run adds Microsoft's repository first, then installs azure-cli (a dry run cannot list it yet)."
      when: not azure_cli_repository_file.stat.exists
