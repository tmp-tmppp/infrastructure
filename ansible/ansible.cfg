[defaults]
inventory = inventory/localhost.yml
interpreter_python = auto_silent
retry_files_enabled = False
nocows = True
# Readable multi-line output, and the diff of a changed file in --diff.
callback_result_format = yaml
# Facts are gathered by the play (the minimal subset is enough); nothing is cached between runs.
gathering = explicit

[privilege_escalation]
# Packages and /usr/local need root: tasks that do say `become: true` themselves, and the password is asked with
# --ask-become-pass, never stored.
become = False
